name: Release APK

# Builds signed APKs and publishes them as a GitHub Release, which is also what
# the in-app updater reads.
#
#   - Push a tag (v0.3.0) to cut a normal release.
#   - Run it manually to publish the current branch as a pre-release, tagged
#     from the versionName in app/build.gradle.kts. The tag is created by the
#     workflow, so no local tag push is needed.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests
        run: ./gradlew :app:testDebugUnitTest

      - name: Build release APKs
        run: ./gradlew :app:assembleRelease

      - name: Work out the version and name the APKs
        id: package
        run: |
          set -euo pipefail

          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            version="${GITHUB_REF_NAME#v}"
          else
            # Manual run: take the version the app reports, so the tag and the
            # in-app updater always agree on what this build is.
            version="$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)"
          fi

          mkdir -p dist
          for abi in arm64-v8a armeabi-v7a x86_64 universal; do
            src="app/build/outputs/apk/release/app-${abi}-release.apk"
            [ -f "$src" ] && cp "$src" "dist/iris-alarm-${version}-${abi}.apk"
          done
          ls -la dist

          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=v${version}" >> "$GITHUB_OUTPUT"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: iris-apks
          path: dist/*.apk
          retention-days: 30

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          # Creates the tag at this commit if it does not exist yet.
          tag_name: ${{ steps.package.outputs.tag }}
          name: IRIS Alarm ${{ steps.package.outputs.version }}
          target_commitish: ${{ github.sha }}
          # Published as a full release even from a manual run: these are the
          # only builds there are, and marking them pre-release hides them from
          # the releases/latest endpoint and from anything else looking for the
          # current version.
          prerelease: false
          files: dist/*.apk
          generate_release_notes: true
          body: |
            Side-loadable APKs for IRIS Alarm ${{ steps.package.outputs.version }}.

            Install **`arm64-v8a`** on any modern phone. `universal` works on
            anything but is roughly three times the size.

            These are signed with the repository's side-load key, so the in-app
            updater (Settings → Updates) can install them over an existing IRIS.
            They are not Play Store builds.
